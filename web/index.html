<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoverPi Control</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; }
        #stream { max-width: 640px; width: 100%; border: 2px solid #555; margin-bottom: 20px; }
        .controls { display: inline-block; text-align: left; background: #333; padding: 20px; border-radius: 8px; }
        #status { font-weight: bold; margin-bottom: 10px; }
        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }
        input[type="text"] { padding: 5px; font-size: 16px; }
        button { padding: 6px 12px; font-size: 16px; cursor: pointer; }
        .dpad-btn { height: 70px; border-radius: 8px; font-weight: bold; background: #555; color: white; border: none; touch-action: none; user-select: none; }
        .dpad-btn:active { background: #777; }
    </style>
</head>
<body>
    <h1>RoverPi Teleoperation</h1>
    <div>
        <img id="stream" src="/stream" alt="Camera Stream (Not Connected)">
    </div>
    
    <div class="controls">
        <div id="status" class="disconnected">Desconectado</div>
        <div>
            <label>PIN:</label>
            <input type="text" id="pinInput" value="4321">
            <button id="connectBtn">Conectar</button>
        </div>
        <p><strong>Controles:</strong></p>
        <ul>
            <li>W: Frente</li>
            <li>S: Ré</li>
            <li>A: Esquerda</li>
            <li>D: Direita</li>
            <li>Q: Diagonal Frente-Esquerda</li>
            <li>E: Diagonal Frente-Direita</li>
        </ul>
        <p><em>Mantenha a tecla (ou os botões virtuais) pressionada para mover.</em></p>
        
        <div id="virtual-dpad" style="display: grid; grid-template-columns: repeat(3, 70px); grid-gap: 10px; justify-content: center; margin-top: 20px;">
            <button class="dpad-btn" data-key="Q">↖ Q</button>
            <button class="dpad-btn" data-key="W">W ⬆</button>
            <button class="dpad-btn" data-key="E">E ↗</button>
            <button class="dpad-btn" data-key="A">A ⬅</button>
            <div></div>
            <button class="dpad-btn" data-key="D">D ➡</button>
            <div></div>
            <button class="dpad-btn" data-key="S">S ⬇</button>
            <div></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
